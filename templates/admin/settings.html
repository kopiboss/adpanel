{{ define "content" }}
<div class="max-w-2xl space-y-5">
    <form method="POST" action="/admin/settings" class="space-y-5">
        <div class="card p-6">
            <div class="flex items-center gap-3 mb-5">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:rgba(59,130,246,0.12)">
                    <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                </div>
                <div>
                    <h3 class="text-sm font-semibold text-white">Telegram Bot</h3>
                    <p class="text-xs text-slate-500">Notifikasi pendaftaran & error token</p>
                </div>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 font-medium mb-1.5">Bot Token</label>
                    <input type="text" name="TELEGRAM_BOT_TOKEN" value="{{ index .settings "TELEGRAM_BOT_TOKEN" }}"
                        placeholder="123456789:ABCdef..." class="input">
                    <p class="text-xs text-slate-600 mt-1">Dapatkan dari @BotFather di Telegram</p>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 font-medium mb-1.5">Chat ID Admin</label>
                    <input type="text" name="TELEGRAM_CHAT_ID" value="{{ index .settings "TELEGRAM_CHAT_ID" }}"
                        placeholder="-100123456789" class="input">
                </div>
            </div>
        </div>

        <div class="card p-6">
            <div class="flex items-center gap-3 mb-5">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:rgba(234,179,8,0.12)">
                    <svg class="w-4 h-4 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </div>
                <div>
                    <h3 class="text-sm font-semibold text-white">Google OAuth2</h3>
                    <p class="text-xs text-slate-500">Login dengan akun Google</p>
                </div>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 font-medium mb-1.5">Client ID</label>
                    <input type="text" name="GOOGLE_CLIENT_ID" value="{{ index .settings "GOOGLE_CLIENT_ID" }}" class="input">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 font-medium mb-1.5">Client Secret</label>
                    <input type="password" name="GOOGLE_CLIENT_SECRET" value="{{ index .settings "GOOGLE_CLIENT_SECRET" }}" class="input">
                </div>
            </div>
        </div>

        <div class="card p-6">
            <div class="flex items-center gap-3 mb-5">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:rgba(255,255,255,0.06)">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/></svg>
                </div>
                <div>
                    <h3 class="text-sm font-semibold text-white">General</h3>
                    <p class="text-xs text-slate-500">Pengaturan umum platform</p>
                </div>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 font-medium mb-1.5">Nama Platform</label>
                    <input type="text" name="SITE_NAME" value="{{ index .settings "SITE_NAME" }}" class="input">
                </div>
                <label class="flex items-center gap-3 cursor-pointer">
                    <div class="relative">
                        <input type="checkbox" name="ALLOW_REGISTRATION" value="true" class="sr-only peer"
                            {{ if eq (index .settings "ALLOW_REGISTRATION") "true" }}checked{{ end }}>
                        <div class="w-9 h-5 rounded-full peer-checked:bg-blue-600 transition-colors" style="background:rgba(255,255,255,0.1)"></div>
                        <div class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-4"></div>
                    </div>
                    <span class="text-sm text-slate-300">Izinkan pendaftaran user baru</span>
                </label>
            </div>
        </div>

        <button type="submit" class="btn-primary">Simpan Perubahan</button>
    </form>
</div>
{{ end }}
