{{ define "content" }}
<div>
    <div x-show="toast" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0"
        :class="toastType==='success'?'border-green-500/30 text-green-300':'border-red-500/30 text-red-300'"
        class="fixed top-5 right-5 border rounded-xl px-4 py-3 text-sm z-50 shadow-xl"
        style="background:#0d1117" x-text="toast">
    </div>

    <div class="card overflow-hidden">
        <div class="px-5 py-4 border-b border-white/5">
            <h3 class="text-sm font-semibold text-white">Semua Users</h3>
        </div>
        <table class="w-full text-sm">
            <thead>
                <tr class="border-b border-white/5">
                    <th class="text-left px-5 py-3 text-xs text-slate-500 font-medium uppercase tracking-wide">User</th>
                    <th class="text-left px-5 py-3 text-xs text-slate-500 font-medium uppercase tracking-wide">Email</th>
                    <th class="text-left px-5 py-3 text-xs text-slate-500 font-medium uppercase tracking-wide">Status</th>
                    <th class="text-left px-5 py-3 text-xs text-slate-500 font-medium uppercase tracking-wide">Daftar</th>
                    <th class="text-left px-5 py-3 text-xs text-slate-500 font-medium uppercase tracking-wide">Aksi</th>
                </tr>
            </thead>
            <tbody>
                {{ range .users }}
                <tr x-data="{ status: '{{ .Status }}', id: {{ .ID }} }" class="table-row">
                    <td class="px-5 py-4">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0"
                                style="background:linear-gradient(135deg,#1e3a8a,#312e81)">
                                {{ slice .Name 0 1 }}
                            </div>
                            <span class="font-medium text-white text-sm">{{ .Name }}</span>
                        </div>
                    </td>
                    <td class="px-5 py-4 text-slate-400 text-sm">{{ .Email }}</td>
                    <td class="px-5 py-4">
                        <span x-text="status"
                            :class="{
                                'badge-yellow': status==='pending',
                                'badge-green': status==='active',
                                'badge-red': status==='suspended'
                            }"
                            class="capitalize inline-block">
                        </span>
                    </td>
                    <td class="px-5 py-4 text-slate-500 text-xs">{{ .CreatedAt.Format "02 Jan 2006" }}</td>
                    <td class="px-5 py-4">
                        <div class="flex items-center gap-2">
                            <template x-if="status==='pending'">
                                <button @click="fetch('/admin/users/'+id+'/approve',{method:'POST'}).then(r=>r.json()).then(d=>{status='active';swalSuccess(d.message)})"
                                    class="btn-primary" style="padding:5px 12px;font-size:12px">✓ Approve</button>
                            </template>
                            <template x-if="status==='pending'">
                                <button @click="if(confirm('Reject user ini?')){fetch('/admin/users/'+id+'/reject',{method:'POST'}).then(r=>r.json()).then(d=>{$el.closest('tr').remove();swalSuccess(d.message)})}"
                                    class="btn-ghost" style="padding:5px 12px;font-size:12px;color:#f87171;border-color:rgba(239,68,68,0.2)">✗ Reject</button>
                            </template>
                            <template x-if="status==='active'">
                                <button @click="fetch('/admin/users/'+id+'/suspend',{method:'POST'}).then(r=>r.json()).then(d=>{status='suspended';swalSuccess(d.message)})"
                                    class="btn-ghost" style="padding:5px 12px;font-size:12px">Suspend</button>
                            </template>
                            <template x-if="status==='suspended'">
                                <button @click="fetch('/admin/users/'+id+'/unsuspend',{method:'POST'}).then(r=>r.json()).then(d=>{status='active';swalSuccess(d.message)})"
                                    class="btn-ghost" style="padding:5px 12px;font-size:12px;color:#60a5fa">Aktifkan</button>
                            </template>
                        </div>
                    </td>
                </tr>
                {{ else }}
                <tr>
                    <td colspan="5" class="px-5 py-16 text-center text-slate-600 text-sm">Belum ada users terdaftar</td>
                </tr>
                {{ end }}
            </tbody>
        </table>
    </div>
</div>
{{ end }}
