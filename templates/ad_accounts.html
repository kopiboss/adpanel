{{ define "content" }}
<div x-data="{
    accounts: {{ .accounts | js }},
    search: '',
    selected: [],
    get filtered() {
        const q = this.search.toLowerCase().trim();
        if (!q) return this.accounts;
        return this.accounts.filter(a =>
            a.name.toLowerCase().includes(q) ||
            a.meta_account_id.includes(q)
        );
    },
    get allSelected() {
        return this.filtered.length > 0 && this.filtered.every(a => this.selected.includes(a.id));
    },
    toggleAll() {
        const ids = this.filtered.map(a => a.id);
        if (this.allSelected) {
            this.selected = this.selected.filter(id => !ids.includes(id));
        } else {
            ids.forEach(id => { if (!this.selected.includes(id)) this.selected.push(id); });
        }
    },
    async bulkSync() {
        if (!this.selected.length) { swalError('Pilih akun dulu'); return; }
        const res = await swalConfirm({
            title: 'Sync ' + this.selected.length + ' akun?',
            text: 'Sinkronisasi akan dijalankan di background.',
            icon: 'question'
        });
        if (!res.isConfirmed) return;
        let ok = 0;
        for (const id of this.selected) {
            const r = await fetch('/sync/' + id, {method:'POST'});
            if (r.ok) ok++;
        }
        swalSuccess(ok + ' akun sedang disync di background');
    }
}" class="space-y-4">

    <!-- Toolbar -->
    <div class="flex items-center gap-3 flex-wrap">
        <!-- Search -->
        <div class="relative flex-1" style="min-width:200px;max-width:400px">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 pointer-events-none"
                style="color:var(--text-muted)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input x-model="search" type="text" placeholder="Cari nama atau ID akun..."
                class="input" style="padding-left:2.5rem">
        </div>

        <!-- Stats -->
        <div class="flex items-center gap-2">
            <span class="badge badge-gray text-xs" x-text="filtered.length + ' akun'"></span>
            <span x-show="selected.length > 0" x-cloak class="badge badge-blue text-xs"
                x-text="selected.length + ' dipilih'"></span>
        </div>

        <!-- Bulk sync -->
        <button x-show="selected.length > 0" x-cloak
            @click="bulkSync()"
            class="btn btn-ghost" style="font-size:12px;color:#60a5fa;border-color:rgba(59,130,246,0.2)">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
            Sync Pilihan (<span x-text="selected.length"></span>)
        </button>

        <a href="/credentials" class="btn btn-primary ml-auto">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Tambah Akun
        </a>
    </div>

    {{ if .accounts }}
    <!-- Table -->
    <div class="card overflow-hidden">
        <!-- Table header -->
        <div class="grid items-center px-5 py-3 border-b" style="border-color:var(--border);background:rgba(255,255,255,0.01);grid-template-columns:40px 40px 1fr auto">
            <div>
                <input type="checkbox" :checked="allSelected" @change="toggleAll()"
                    class="w-4 h-4 accent-blue-600 rounded">
            </div>
            <div></div>
            <div class="text-xs font-medium uppercase tracking-wide" style="color:var(--text-sub)">Akun Iklan</div>
            <div class="text-xs font-medium uppercase tracking-wide text-right" style="color:var(--text-sub)" x-text="filtered.length + ' dari {{ len .accounts }}'"></div>
        </div>

        <!-- Rows -->
        <div class="divide-y" style="divide-color:var(--border)">
            <template x-for="acc in filtered" :key="acc.id">
                <div x-data="{ isActive: acc.is_active, syncing: false }"
                    class="grid items-center px-5 py-4 hover:bg-white/2 transition-colors"
                    style="grid-template-columns:40px 44px 1fr auto">

                    <!-- Checkbox -->
                    <div>
                        <input type="checkbox" :value="acc.id" x-model="selected"
                            class="w-4 h-4 accent-blue-600 rounded">
                    </div>

                    <!-- Icon -->
                    <div>
                        <div class="w-8 h-8 rounded-xl flex items-center justify-center text-sm"
                            :style="isActive ? 'background:rgba(59,130,246,0.12)' : 'background:rgba(255,255,255,0.04)'">
                            📊
                        </div>
                    </div>

                    <!-- Info -->
                    <div class="min-w-0 pr-4">
                        <div class="flex items-center gap-2 mb-0.5">
                            <span class="text-sm font-semibold text-white truncate" x-text="acc.name"></span>
                            <span x-show="!isActive" class="badge badge-gray flex-shrink-0" style="font-size:10px">Nonaktif</span>
                        </div>
                        <p class="text-xs truncate" style="color:var(--text-sub)"
                            x-text="acc.meta_account_id + ' · ' + acc.currency + ' · ' + acc.timezone"></p>
                        <p class="text-xs mt-0.5 truncate" style="color:var(--text-muted)"
                            x-text="acc.credential_label || ''"></p>
                    </div>

                    <!-- Actions -->
                    <div class="flex items-center gap-2 flex-shrink-0">
                        <!-- Sync -->
                        <button @click="
                            syncing = true;
                            fetch('/sync/' + acc.id, {method:'POST'})
                            .then(r => r.json())
                            .then(d => { syncing = false; swalSuccess(d.message); })"
                            :disabled="syncing"
                            class="btn btn-ghost"
                            style="font-size:12px;padding:5px 10px;color:#60a5fa;border-color:rgba(59,130,246,0.15)">
                            <svg class="w-3.5 h-3.5" :class="syncing ? 'animate-spin' : ''"
                                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                            </svg>
                            <span x-text="syncing ? 'Sync...' : 'Sync'"></span>
                        </button>

                        <!-- Toggle active -->
                        <button type="button"
                            @click="fetch('/ad-accounts/' + acc.id + '/toggle', {method:'POST'})
                                .then(r => r.json())
                                .then(d => { isActive = d.is_active; swalSuccess(d.message); })"
                            class="relative flex-shrink-0 rounded-full transition-all duration-200"
                            :class="isActive ? 'bg-blue-600' : 'bg-white/10'"
                            style="width:38px;height:22px;border:none;cursor:pointer;outline:none">
                            <span class="absolute top-0.5 rounded-full bg-white shadow-sm transition-all duration-200"
                                :class="isActive ? 'translate-x-[18px]' : 'translate-x-[2px]'"
                                style="width:18px;height:18px;display:block"></span>
                        </button>

                        <!-- Delete -->
                        <button @click="
                            swalConfirm({title:'Hapus akun ini?', html:'<span style=\'color:#94a3b8\'>' + acc.name + '</span>'})
                            .then(r => {
                                if (r.isConfirmed) {
                                    fetch('/ad-accounts/' + acc.id, {method:'DELETE'})
                                    .then(r => r.json())
                                    .then(d => {
                                        swalSuccess(d.message);
                                        accounts = accounts.filter(a => a.id !== acc.id);
                                    })
                                }
                            })"
                            class="flex items-center justify-center w-8 h-8 rounded-lg transition-colors"
                            style="color:var(--text-muted);background:transparent"
                            @mouseenter="$el.style.color='#f87171';$el.style.background='rgba(239,68,68,0.08)'"
                            @mouseleave="$el.style.color='var(--text-muted)';$el.style.background='transparent'">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </template>

            <!-- Empty search -->
            <div x-show="filtered.length === 0 && search" class="py-14 text-center">
                <svg class="w-8 h-8 mx-auto mb-2" style="color:var(--text-muted)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <p class="text-sm text-slate-500">Tidak ada akun untuk "<span x-text="search" class="text-white"></span>"</p>
                <a href="/credentials" class="text-xs text-blue-400 hover:text-blue-300 mt-2 inline-block">
                    Fetch akun dari kredensial →
                </a>
            </div>
        </div>
    </div>

    {{ else }}
    <div class="card flex flex-col items-center justify-center py-16 text-center">
        <div class="w-12 h-12 rounded-2xl flex items-center justify-center mb-3"
            style="background:rgba(255,255,255,0.03)">
            <svg class="w-6 h-6" style="color:var(--text-muted)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16"/>
            </svg>
        </div>
        <p class="text-sm text-slate-500">Belum ada ad account</p>
        <p class="text-xs mt-1 mb-3" style="color:var(--text-muted)">Tambahkan kredensial dan fetch akun iklan</p>
        <a href="/credentials" class="btn btn-primary" style="font-size:12px;padding:6px 14px">
            Tambah Kredensial →
        </a>
    </div>
    {{ end }}
</div>
{{ end }}
