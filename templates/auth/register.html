<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - AdPanel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center">
<div class="w-full max-w-md px-4 py-8">
    <div class="text-center mb-8">
        <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center font-bold text-xl mx-auto mb-3">A</div>
        <h1 class="text-2xl font-bold text-white">AdPanel</h1>
        <p class="text-slate-400 text-sm mt-1">Buat akun baru</p>
    </div>

    <div class="bg-slate-800 rounded-2xl border border-slate-700 p-8">
        <h2 class="text-lg font-semibold text-white mb-6">Daftar Akun</h2>

        {{ if .error }}
        <div class="mb-4 p-3 bg-red-900/50 border border-red-700 rounded-lg text-red-300 text-sm">
            {{ .error }}
        </div>
        {{ end }}

        <form method="POST" action="/register" class="space-y-4">
            <div>
                <label class="block text-sm text-slate-400 mb-1.5" for="name">Nama Lengkap</label>
                <input type="text" id="name" name="name" required
                    class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 text-sm"
                    placeholder="John Doe">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1.5" for="email">Email</label>
                <input type="email" id="email" name="email" required
                    class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 text-sm"
                    placeholder="nama@email.com">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1.5" for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="8"
                    class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 text-sm"
                    placeholder="Minimal 8 karakter">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1.5" for="confirm_password">Konfirmasi Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                    class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 text-sm"
                    placeholder="Ulangi password">
            </div>
            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition text-sm">
                Daftar
            </button>
        </form>

        <div class="mt-4 p-3 bg-yellow-900/30 border border-yellow-700/50 rounded-lg">
            <p class="text-xs text-yellow-400">
                ⚠️ Setelah mendaftar, akun Anda perlu disetujui oleh admin sebelum bisa login.
            </p>
        </div>

        <p class="text-center text-sm text-slate-400 mt-6">
            Sudah punya akun?
            <a href="/login" class="text-blue-400 hover:text-blue-300">Masuk di sini</a>
        </p>
    </div>
</div>
</body>
</html>
