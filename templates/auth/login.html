<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AdPanel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center">
<div class="w-full max-w-md px-4">
    <div class="text-center mb-8">
        <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center font-bold text-xl mx-auto mb-3">A</div>
        <h1 class="text-2xl font-bold text-white">AdPanel</h1>
        <p class="text-slate-400 text-sm mt-1">Platform Manajemen Meta Ads</p>
    </div>

    <div class="bg-slate-800 rounded-2xl border border-slate-700 p-8">
        <h2 class="text-lg font-semibold text-white mb-6">Masuk ke Akun</h2>

        {{ if .error }}
        <div class="mb-4 p-3 bg-red-900/50 border border-red-700 rounded-lg text-red-300 text-sm">
            {{ .error }}
        </div>
        {{ end }}

        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label class="block text-sm text-slate-400 mb-1.5" for="email">Email</label>
                <input type="email" id="email" name="email" required
                    class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 text-sm"
                    placeholder="nama@email.com">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1.5" for="password">Password</label>
                <input type="password" id="password" name="password" required
                    class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 text-sm"
                    placeholder="••••••••">
            </div>
            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition text-sm">
                Masuk
            </button>
        </form>

        <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-slate-700"></div>
            </div>
            <div class="relative flex justify-center text-xs">
                <span class="px-3 bg-slate-800 text-slate-500">atau</span>
            </div>
        </div>

        <a href="/auth/google"
            class="flex items-center justify-center gap-3 w-full border border-slate-600 hover:border-slate-500 text-white font-medium py-2.5 rounded-lg transition text-sm">
            <svg class="w-5 h-5" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0124 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 01-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
            Masuk dengan Google
        </a>

        <p class="text-center text-sm text-slate-400 mt-6">
            Belum punya akun?
            <a href="/register" class="text-blue-400 hover:text-blue-300">Daftar sekarang</a>
        </p>
    </div>
</div>
</body>
</html>
